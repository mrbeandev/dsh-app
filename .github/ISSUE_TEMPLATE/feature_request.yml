name: Feature request
description: Suggest something the app should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the situation or problem, not just the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: How you imagine it working. If the Harness web UI already does it, say where.
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, links, alternatives you've tried.
